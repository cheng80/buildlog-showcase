<!doctype html>
<!--
  OG 공유 이미지 소스 (1200×630). 렌더링해서 app/opengraph-image.png 로 저장한다.
  재생성: scratchpad에서 playwright-core로 이 파일을 열어 viewport 1200×630, deviceScaleFactor 1 로 스크린샷.
    const p = await browser.newPage({ viewport: { width: 1200, height: 630 } });
    await p.goto("file://…/docs/og/og-source.html"); await p.evaluate(() => document.fonts.ready);
    await p.screenshot({ path: "app/opengraph-image.png" });
  색·모서리 값은 ../../DESIGN.md 를 따른다. 문구는 app/site.ts, app/page.tsx 히어로와 같아야 한다.
-->
<html lang="ko">
<head>
<meta charset="utf-8" />
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css" />
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 1200px; height: 630px; overflow: hidden; }
  body {
    font-family: "Pretendard Variable", Pretendard, -apple-system, "Apple SD Gothic Neo", "Malgun Gothic", system-ui, sans-serif;
    background: #fbfbf9;
    color: #111;
    display: grid;
    grid-template-columns: 1fr 400px;
    gap: 56px;
    padding: 72px 80px;
    align-items: center;
    word-break: keep-all;
  }
  .brand { display: flex; align-items: center; gap: 14px; font-size: 30px; font-weight: 800; }
  .mark { width: 40px; height: 40px; border-radius: 12px; background: #1e4fd8; position: relative; }
  .mark::after { content: ""; position: absolute; inset: 10px 10px 10px 15px; border-left: 5px solid #fff; border-bottom: 5px solid #fff; border-radius: 0 0 0 4px; }
  .chip { display: inline-block; margin-top: 40px; padding: 10px 20px; border-radius: 999px; background: #e7edfc; color: #1e4fd8; font-size: 22px; font-weight: 700; }
  h1 { margin-top: 22px; font-size: 62px; line-height: 1.18; letter-spacing: -0.03em; font-weight: 800; }
  .lead { margin-top: 24px; font-size: 24px; line-height: 1.5; color: #62625b; max-width: 600px; }
  .url { margin-top: 36px; font-size: 20px; color: #62625b; font-weight: 600; }

  .window { background: #fff; border: 1px solid #dadad3; border-radius: 28px; overflow: hidden; box-shadow: 0 30px 60px -30px rgba(17,17,17,.25); }
  .bar { display: flex; align-items: center; gap: 10px; padding: 14px 18px; border-bottom: 1px solid #dadad3; font-weight: 700; font-size: 17px; }
  .bar .mark { width: 22px; height: 22px; border-radius: 7px; }
  .bar .mark::after { inset: 6px 6px 6px 9px; border-width: 0 0 3px 3px; }
  .tab { margin-left: auto; padding: 3px 12px; border-radius: 999px; background: #f6f6f3; color: #62625b; font-size: 15px; font-weight: 600; }
  .post { margin: 12px; border: 1px solid #dadad3; border-radius: 14px; overflow: hidden; background: #fff; }
  .head { display: flex; align-items: center; gap: 10px; padding: 12px 14px; font-size: 15px; }
  .av { width: 30px; height: 30px; border-radius: 50%; background: linear-gradient(150deg, #0f2c29, #2dd4bf); }
  .name { font-weight: 700; }
  .handle { color: #62625b; font-size: 13px; }
  .shot { position: relative; height: 200px; background: linear-gradient(160deg, #173f3b, #0f2c29); display: grid; place-items: center; }
  .top { position: absolute; top: 12px; left: 14px; color: rgba(255,255,255,.7); font-size: 13px; font-weight: 600; }
  .ring { width: 96px; height: 96px; border-radius: 50%; border: 6px solid #2dd4bf; border-right-color: rgba(255,255,255,.15); }
  .play { position: absolute; width: 52px; height: 52px; border-radius: 50%; background: rgba(255,255,255,.92); }
  .play::after { content: ""; position: absolute; left: 21px; top: 16px; border-left: 14px solid #111; border-top: 10px solid transparent; border-bottom: 10px solid transparent; }
  .btns { position: absolute; left: 14px; right: 14px; bottom: 12px; display: flex; gap: 8px; }
  .btns i { flex: 1; text-align: center; padding: 7px 0; border-radius: 999px; font-style: normal; font-size: 12px; font-weight: 700; }
  .fill { background: #2dd4bf; color: #0f2c29; }
  .line { border: 1.5px solid rgba(255,255,255,.4); color: #fff; }
  .actions { display: flex; gap: 14px; padding: 10px 14px 0; }
  .actions svg { width: 22px; height: 22px; fill: none; stroke: #111; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
  .actions svg:first-child { stroke: #ef4b5f; fill: #ef4b5f; }
  .text { padding: 8px 14px 0; font-weight: 600; font-size: 15px; }
  .proj { display: flex; align-items: center; gap: 8px; margin: 10px 14px 14px; padding: 8px 12px; border-radius: 10px; background: #f6f6f3; font-size: 14px; font-weight: 600; }
  .proj span:last-child { margin-left: auto; color: #62625b; font-weight: 500; }
  .proj svg { width: 18px; height: 18px; fill: none; stroke: #333; stroke-width: 1.8; }
</style>
</head>
<body>
  <div>
    <div class="brand"><span class="mark"></span>빌드로그</div>
    <div class="chip">개발 과정을 공유하는 프로젝트 SNS</div>
    <h1>오늘 만든 것을 올리면,<br>프로젝트가 알려집니다</h1>
    <p class="lead">스크린샷이나 유튜브 링크를 붙여 올리면 게시물이 피드에 뜨고, 같은 게시물이 프로젝트 페이지에 개발 기록으로 쌓입니다.</p>
    <p class="url">buildlog-showcase.vercel.app</p>
  </div>

  <div class="window">
    <div class="bar"><span class="mark"></span>빌드로그<span class="tab">피드</span></div>
    <div class="post">
      <div class="head"><span class="av"></span><span class="name">민지</span><span class="handle">@minji_makes</span></div>
      <div class="shot">
        <span class="top">집중 · 25분</span>
        <span class="ring"></span>
        <span class="play"></span>
        <div class="btns"><i class="fill">일시정지</i><i class="line">종료</i></div>
      </div>
      <div class="actions">
        <svg viewBox="0 0 24 24"><path d="M12 20s-7-4.5-7-10a4 4 0 0 1 7-2.6A4 4 0 0 1 19 10c0 5.5-7 10-7 10z"/></svg>
        <svg viewBox="0 0 24 24"><path d="M4 5h16v11H9l-5 4z"/></svg>
        <svg viewBox="0 0 24 24" style="margin-left:auto"><path d="M7 4h10v16l-5-3.5L7 20z"/></svg>
      </div>
      <div class="text">집중 화면을 더 단순하게 바꿨어요</div>
      <div class="proj"><svg viewBox="0 0 24 24"><path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/></svg><span>작은 타이머</span><span>v0.6</span></div>
    </div>
  </div>
</body>
</html>
